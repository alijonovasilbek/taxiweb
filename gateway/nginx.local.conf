# Lokal test uchun gateway: tayyor build'larni beradi, API va socket'ni
# host'dagi backend'ga (uvicorn :3000) yo'naltiradi. ngrok shu portga ulanadi.
# Ishga tushirish:
#   docker run -d --name chortoq_gateway -p 8080:80 \
#     -v ./gateway/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro \
#     -v ./passenger-app/dist:/srv/app:ro -v ./admin-panel/dist:/srv/admin:ro nginx:alpine

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    client_max_body_size 20m;

    # Chortoq Services Mini App
    root /srv/app;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Eski haydovchi ilovasi o'rniga — Mini App'ning "Taksi" bo'limi (ijrochi rejimi)
    location /driver/ {
        absolute_redirect off;
        return 302 /taxi-driver;
    }

    # Admin panel (base: /admin/)
    location /admin/ {
        alias /srv/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://host.docker.internal:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://host.docker.internal:3000/uploads/;
    }
}
