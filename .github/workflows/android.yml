# Android APK yig'ish: "Chortoq Ijrochi" (driver-mobile) va mijozlar uchun "Chortoq" (client-mobile)
# PLAN-ANDROID §9, PLAN-MIJOZ-ANDROID §8. Ikkala ilova parallel (matrix) yig'iladi.
#
#  • PR / push (driver-mobile o'zgarsa): typecheck + lint + SINOV APK
#      - har doim release varianti: JS kodi APK ichida (debug varianti uni kompyuterdagi Metro'dan yuklaydi
#        va haydovchi telefonida ishlamaydi). Sinov APK'si prebuild'ning debug kaliti bilan imzolanadi.
#      - android-app / main ga push: APK "android-dev" pre-release'ga ham yuklanadi (ommaviy, tokensiz havola)
#  • v* teg (masalan v1.0.0): haqiqiy kalit bilan imzolangan release APK → GitHub Release
#
# Repo sozlamalari (Settings → Secrets and variables → Actions):
#   Variables: API_URL                      — backend manzili (https://..., oxirida / siz)
#   Secrets:   ANDROID_KEYSTORE_BASE64      — release keystore (base64)
#              KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#              GOOGLE_SERVICES_JSON         — Firebase (push)
name: Android

on:
  pull_request:
    paths: ["driver-mobile/**", "client-mobile/**", ".github/workflows/android.yml"]
  push:
    branches: [main, android-app]
    paths: ["driver-mobile/**", "client-mobile/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # GitHub Release yaratish uchun

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: driver-mobile
            slug: chortoq-ijrochi
            title: Chortoq Ijrochi
          - dir: client-mobile
            slug: chortoq
            title: Chortoq
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Faqat ARM (haqiqiy telefonlar): x86 emulyator kutubxonalarisiz APK ~2 baravar kichik
      ABIS: armeabi-v7a,arm64-v8a
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Gradle keshi (android/ papkasi prebuild'dan keyin paydo bo'ladi — setup-java keshi uni topolmaydi)
      - uses: gradle/actions/setup-gradle@v4

      - name: Versiya
        run: |
          if [ "$RELEASE" = "true" ]; then
            V="${GITHUB_REF_NAME#v}"
            IFS=. read -r MA MI PA <<< "$V"
            # 1.2.3 → 10203: tegdan aniq va har doim o'suvchi versionCode
            echo "APP_VERSION=$V" >> "$GITHUB_ENV"
            echo "APP_VERSION_CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: API manzili tekshiruvi
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::warning::API_URL repo o'zgaruvchisi o'rnatilmagan — ilova serverga ulana olmaydi"
          fi

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint

      - name: Firebase (bo'lsa)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > google-services.json; fi

      - name: Native loyiha (CNG)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Release APK
        working-directory: ${{ matrix.dir }}/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures="$ABIS"

      - name: Sinov APK (debug kalit bilan)
        if: env.RELEASE != 'true'
        run: |
          OUT="${{ matrix.slug }}-dev.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          ls -la "$OUT"
          echo "APK_PATH=${{ matrix.dir }}/$OUT" >> "$GITHUB_ENV"

      # Kompyuter emulyatorlari (BlueStacks, LDPlayer, Android Studio) uchun x86 APK.
      # ARM APK'ni ular tarjima qilib ham ocholmaydi (BlueStacks Nougat32: "undefined symbol: dl_unwind_find_exidx").
      - name: Emulyator APK (x86, x86_64)
        if: env.RELEASE != 'true'
        continue-on-error: true
        run: |
          (cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86,x86_64)
          OUT="${{ matrix.slug }}-emulator.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          ls -la "$OUT"
          echo "EMU_PATH=${{ matrix.dir }}/$OUT" >> "$GITHUB_ENV"

      - name: Release imzosi
        if: env.RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret yo'q"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          OUT="${{ matrix.slug }}-${APP_VERSION}.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "$OUT" android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs "$OUT" | head -3
          rm -f "$RUNNER_TEMP/release.jks"
          echo "APK_PATH=${{ matrix.dir }}/$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-${{ env.RELEASE == 'true' && 'release' || 'dev' }}-${{ github.run_number }}
          path: |
            ${{ env.APK_PATH }}
            ${{ env.EMU_PATH }}
          retention-days: 14

      # Sinov APK'lari uchun doimiy ommaviy havolalar (ikkala ilova bitta pre-release'da):
      #   https://github.com/<repo>/releases/download/android-dev/chortoq-ijrochi-dev.apk  (ijrochi)
      #   https://github.com/<repo>/releases/download/android-dev/chortoq-dev.apk          (mijoz)
      - name: android-dev pre-release
        if: env.RELEASE != 'true' && github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SERVER="${EXPO_PUBLIC_API_URL:-sozlanmagan}"
          NOTES="Sinov APK'lari: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}, run #${{ github.run_number }}. Server: ${SERVER}"
          # Ikkala job parallel: kim birinchi bo'lsa yaratadi, keyingisi faqat fayllarini almashtiradi
          for i in 1 2 3; do
            gh release view android-dev >/dev/null 2>&1 && break
            gh release create android-dev --prerelease --target "$GITHUB_SHA"               --title "Chortoq ilovalari - sinov" --notes "$NOTES" && break
            sleep 5
          done
          # EMU_PATH bo'sh bo'lsa (emulyator build yiqilsa) faqat telefon APK'si yuklanadi
          gh release upload android-dev "$APK_PATH" ${EMU_PATH:+"$EMU_PATH"} --clobber
          gh release edit android-dev --notes "$NOTES" || true

      - name: GitHub Release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
