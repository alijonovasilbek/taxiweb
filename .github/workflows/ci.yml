name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: taxigo
          POSTGRES_PASSWORD: taxigo
          POSTGRES_DB: taxigo_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taxigo" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://taxigo:taxigo@localhost:5432/taxigo_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-not-for-production-0123456789abcdef0123456789abcdef
      ADMIN_JWT_SECRET: ci-admin-secret-not-for-production-0123456789abcdef0123456789
      ADMIN_TELEGRAM_IDS: "123456789"
      TELEGRAM_BOT_TOKEN: "0000000000:ci-disabled"
      DEV_MODE: "true"
      OSRM_URL: http://localhost:5999   # tarmoqsiz: marshrut taxminiy hisoblanadi
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: alembic upgrade head
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [passenger-app, admin-panel]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
